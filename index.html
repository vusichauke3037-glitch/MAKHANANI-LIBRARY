<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordsworth Library</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      padding-top: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 800px;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .logo {
      max-width: 100px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo" class="logo">
    <h1 class="text-center">Wordsworth Library</h1>
    
    <!-- Login Form -->
    <div id="loginForm">
      <h2>Login</h2>
      <form>
        <div class="form-group">
          <label for="schoolCode">School</label>
          <select id="schoolCode" class="form-control">
            <option value="SCH001">Wordsworth High</option>
            <option value="SCH002">Springfield College</option>
            <!-- Add more schools -->
          </select>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button type="button" id="loginBtn" class="btn btn-primary">Login</button>
      </form>
    </div>
    
    <!-- Main App -->
    <div id="app" style="display: none;">
      <h2>Books</h2>
      <table class="table">
        <thead>
          <tr>
            <th>Barcode</th>
            <th>Title</th>
            <th>Author</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="booksTable">
          <!-- Books data -->
        </tbody>
      </table>
      
      <h2>Learners</h2>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Grade</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="learnersTable">
          <!-- Learners data -->
        </tbody>
      </table>
    </div>
  </div>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    
    // Login logic
    document.getElementById('loginBtn').addEventListener('click', () => {
      const schoolCode = document.getElementById('schoolCode').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      // Auth logic here
      localStorage.setItem('schoolCode', schoolCode);
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadData();
    });
    
    // Load data
    function loadData() {
      const schoolCode = localStorage.getItem('schoolCode');
      const booksRef = firebase.database().ref(`schools/${schoolCode}/books`);
      const learnersRef = firebase.database().ref(`schools/${schoolCode}/learners`);
      
      booksRef.on('value', snapshot => {
        const booksTable = document.getElementById('booksTable');
        booksTable.innerHTML = '';
        snapshot.forEach(child => {
          const book = child.val();
          const row = `<tr>
            <td>${child.key}</td>
            <td>${book.title}</td>
            <td>${book.author}</td>
            <td><button class="btn btn-sm btn-primary">Issue</button></td>
          </tr>`;
          booksTable.innerHTML += row;
        });
      });
      
      learnersRef.on('value', snapshot => {
        const learnersTable = document.getElementById('learnersTable');
        learnersTable.innerHTML = '';
        snapshot.forEach(child => {
          const learner = child.val();
          const row = `<tr>
            <td>${child.key}</td>
            <td>${learner.name}</td>
            <td>${learner.grade}</td>
            <td><button class="btn btn-sm btn-info">View Loans</button></td>
          </tr>`;
          learnersTable.innerHTML += row;
        });
      });
    }
  </script>
</body>
</html>
