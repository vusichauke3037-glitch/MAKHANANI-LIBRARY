<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGENT TRACKER - ADMIN ONLY</title><style>body{margin:0;font-family:Arial;background:#eef4ff;padding:12px} .box{max-width:900px;margin:auto;background:#fff;padding:14px;border-radius:14px} input,select{width:100%;padding:12px;margin:6px 0;border:2px solid #bfdbfe;border-radius:10px;font-size:16px} button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#1a56db;color:#fff;font-weight:900;font-size:16px} .green{background:#16a34a} .yellow{background:#facc15;color:#000} .red{background:#dc2626} .badge{background:#f0f9ff;border:2px solid #bfdbfe;border-radius:10px;padding:10px;margin:6px 0} table{width:100%;border-collapse:collapse;font-size:13px} td,th{border:1px solid #000;padding:6px} th{background:#0a1a4d;color:#fff}</style></head><body><div class="box">
<img src="logo.png" style="width:180px;display:block;margin:auto"><h2 style="text-align:center">👑 AGENT TRACKER - ADMIN ONLY 🔒</h2><p style="text-align:center;font-weight:900">Founder Only! Do NOT share this page!</p>
<div style="background:#16a34a;color:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:900"><span id="totAgents">0</span> Agents | <span id="totSchools">0</span> Schools Signed | <span id="totOwe">R0</span> Owe Agents | <span id="totEarn">R0</span> YOU Earn /m</div>
<h3>➕ ADD AGENT</h3><input id="aName" placeholder="Agent Full Name"><input id="aPhone" placeholder="Agent WhatsApp e.g. 078..."><input id="aArea" placeholder="Area e.g. Daveyton - ONE area only!"><button class="green" onclick="addAgent()">➕ ADD AGENT</button>
<h3>🏫 AGENT SIGNED A SCHOOL?</h3><select id="sAgent"></select><input id="sSchool" placeholder="School Name"><input id="sEmis" placeholder="School EMIS"><input id="sPrin" placeholder="Principal Name + Number"><select id="sStatus"><option value="DEMO">DEMO - Free 7 Days</option><option value="STARTER">STARTER - R2,500 + R350/m</option><option value="STANDARD">STANDARD - R3,500 + R550/m</option><option value="PREMIUM">PREMIUM - R5,000 + R850/m</option><option value="PAID">PAID - Give R500!</option></select><button onclick="addSchool()">🏫 ADD SCHOOL TO AGENT</button>
<h3>💰 PAY AGENT R500?</h3><select id="pSchool"></select><button class="yellow" onclick="payAgent()">✅ MARK AS PAID R500</button>
<div id="list"></div>
<button class="red" onclick="if(confirm('Clear all agents?')){localStorage.removeItem('mk_agents');localStorage.removeItem('mk_agentSchools');location.reload()}">🗑️ RESET</button>
<button onclick="window.print()">🖨️ PRINT AGENT REPORT</button>
</div><script>
var agents=JSON.parse(localStorage.getItem('mk_agents')||'[]');
var schools=JSON.parse(localStorage.getItem('mk_agentSchools')||'[]');
function save(){localStorage.setItem('mk_agents',JSON.stringify(agents));localStorage.setItem('mk_agentSchools',JSON.stringify(schools));render();}
function addAgent(){var n=document.getElementById('aName').value.trim();var p=document.getElementById('aPhone').value.trim();var a=document.getElementById('aArea').value.trim();if(!n||!p){alert('Type Name + Phone!');return;}agents.push({id:'AG-'+Date.now(),name:n,phone:p,area:a});save();alert('Agent Added! '+n+' - '+a);document.getElementById('aName').value='';document.getElementById('aPhone').value='';document.getElementById('aArea').value='';}
function addSchool(){var ag=document.getElementById('sAgent').value;var sc=document.getElementById('sSchool').value.trim();var em=document.getElementById('sEmis').value.trim();var pr=document.getElementById('sPrin').value.trim();var st=document.getElementById('sStatus').value;if(!ag||!sc){alert('Select Agent + School!');return;}schools.push({id:'SC-'+Date.now(),agent:ag,school:sc,emis:em,prin:pr,status:st,paid:false,date:new Date().toLocaleDateString()});save();alert('School Added to Agent! '+sc);document.getElementById('sSchool').value='';document.getElementById('sEmis').value='';document.getElementById('sPrin').value='';}
function payAgent(){var id=document.getElementById('pSchool').value;for(var i=0;i<schools.length;i++){if(schools[i].id===id){schools[i].paid=true;schools[i].status='PAID';alert('PAID R500 to agent for '+schools[i].school);}}save();}
function render(){var agOpt='';for(var i=0;i<agents.length;i++) agOpt+='<option value="'+agents[i].id+'">'+agents[i].name+' - '+agents[i].area+'</option>';document.getElementById('sAgent').innerHTML=agOpt||'<option value="">Add Agent First</option>';var scOpt='';for(var j=0;j<schools.length;j++){if(!schools[j].paid) scOpt+='<option value="'+schools[j].id+'">'+schools[j].school+' - '+schools[j].agentName+'</option>';}var pEl=document.getElementById('pSchool');pEl.innerHTML=scOpt||'<option value="">No Unpaid Schools</option>';var html='';var owe=0;var earn=0;for(var a=0;a<agents.length;a++){var ag=agents[a];var my=[];for(var s=0;s<schools.length;s++){if(schools[s].agent===ag.id) my.push(schools[s]);}var unpaid=0;for(var u=0;u<my.length;u++){if(!my[u].paid) unpaid++;}owe+=unpaid*500;var monthly=0;for(var m=0;m<my.length;m++){if(my[m].status==='STARTER') monthly+=35;if(my[m].status==='STANDARD') monthly+=55;if(my[m].status==='PREMIUM') monthly+=85;}earn+=monthly;html+='<div class="badge"><b>'+ag.name+'</b> - '+ag.phone+'<br>📍 Area: '+ag.area+'<br>🏫 Schools: '+my.length+' | ❌ Unpaid R500 x '+unpaid+' = R'+(unpaid*500)+'<br>💰 You Owe Agent 10%/m: R'+monthly+'/m<br>';for(var k=0;k<my.length;k++){var x=my[k];html+='- '+x.school+' ('+x.emis+') - '+x.status+' - '+(x.paid?'✅ PAID R500':'❌ NOT PAID')+' - '+x.date+'<br>';}html+='<button onclick="window.open(\'https://wa.me/27'+ag.phone.replace(/[^0-9]/g,'').slice(-9)+'?text='+encodeURIComponent('Hi '+ag.name+'! Update: You have '+my.length+' schools. Unpaid: R'+(unpaid*500))+',\'_blank\')">📤 WHATSAPP AGENT</button></div>';}document.getElementById('list').innerHTML=html||'No agents yet!';document.getElementById('totAgents').innerText=agents.length;document.getElementById('totSchools').innerText=schools.length;document.getElementById('totOwe').innerText='R'+owe;document.getElementById('totEarn').innerText='R'+earn;}
render();</script></body></html>
